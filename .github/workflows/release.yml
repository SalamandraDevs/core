name: Release

# Publishing model:
#   - Triggered by pushing a semver tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#   - CI authenticates with a granular "write staged" token (NPM_TOKEN secret) and runs
#     `npm stage publish`, which does NOT make the version live. It parks the release in
#     npm's staging queue.
#   - A maintainer then promotes it with 2FA:
#       npm stage list @salamandradevs/core
#       npm stage approve <id>      # or reject from npmjs.com
#   - Provenance is attached automatically (public repo + public package + id-token: write).
#
# Note: core depends on @salamandradevs/tools from npm, so publish & approve tools first.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for npm provenance attestations
  contents: read

jobs:
  stage-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # never cache in release builds

      - name: Use an npm with staged-publish support
        run: npm install -g npm@latest   # needs >= 11.15.0 for `npm stage publish`

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Guard against republishing an existing version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@salamandradevs/core@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@salamandradevs/core@${VERSION} is already published. Bump the version."
            exit 1
          fi

      - name: Stage publish to npm
        run: npm stage publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
